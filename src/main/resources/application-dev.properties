spring.datasource.url=${DB_DEV_URL}
spring.datasource.username=${DB_DEV_USER}
spring.datasource.password=${DB_DEV_PASS}

spring.jpa.hibernate.ddl-auto=update

jwt.issuer=${JWT_ISSUER}
jwt.access-secret=${JWT_ACCESS_SECRET}
jwt.secret=${JWT_ACCESS_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.com.morago.backend.controller=DEBUG
logging.level.com.morago.backend.listener=DEBUG

springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.default-produces-media-type=application/json

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair=true

# AWS (from .env)
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region.static=${AWS_REGION}
app.storage.type=${APP_STORAGE_TYPE}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET}
app.storage.s3.region=${APP_STORAGE_S3_REGION}
app.storage.s3.key-prefix=${APP_STORAGE_S3_KEY_PREFIX}
app.storage.public-base-url=${APP_STORAGE_PUBLIC_BASE_URL}
