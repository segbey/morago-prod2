spring.datasource.url=${DB_DEV_URL:jdbc:mysql://localhost:3306/backend_dev}
spring.datasource.username=${DB_DEV_USER:root}
spring.datasource.password=${DB_DEV_PASS:password}

spring.jpa.hibernate.ddl-auto=update

jwt.access-secret=${JWT_ACCESS_SECRET:dev_access_secret}
jwt.refresh-secret=${JWT_REFRESH_SECRET:dev_refresh_secret}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.com.morago.backend.controller=DEBUG
logging.level.com.morago.backend.listener=DEBUG

springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.default-produces-media-type=application/json

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

